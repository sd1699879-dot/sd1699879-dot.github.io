 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Aesthetic Diary ♡</title>

  <style>
    body {
      margin: 0;
      background: #fff7f8;
      color: #6d5058;
      font-family: Georgia, serif;
      text-align: center;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 45px 20px;
    }

    .top {
      font-size: 25px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 42px;
      margin: 10px 0;
      font-weight: normal;
    }

    .subtitle {
      font-size: 18px;
      margin-bottom: 35px;
      color: #8a6871;
    }

    .diary-photo {
      width: 100%;
      max-width: 650px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(100, 70, 80, 0.18);
    }

    .note {
      background: #ffffff;
      max-width: 600px;
      margin: 35px auto;
      padding: 30px 25px;
      border-radius: 25px;
      box-shadow: 0 5px 20px rgba(100, 70, 80, 0.08);
    }

    .note h2 {
      font-size: 27px;
      font-weight: normal;
    }

    .note p {
      font-size: 17px;
      line-height: 1.8;
    }

    .footer {
      margin-top: 35px;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="top">♡ 🌷 ♡</div>

    <h1>My Aesthetic Diary</h1>

    <p class="subtitle">
      A little hello from me ✨
    </p>

    <img
      class="diary-photo"
      src="file_00000000ba848211ad6ffee2b7703aee.png"
      alt="My Aesthetic Diary"
    >

    <div class="note">
      <h2>Dear Diary ♡</h2>

      <p>
        Little moments, pretty memories and beautiful dreams —
        welcome to my tiny corner of the internet. 🌸
      </p>

      <p>
        Here I can keep my favourite memories,
        thoughts and little pieces of my life. ✨
      </p>
    </div>

    <div class="footer">
      Made with love ♡
    </div>

  </div>

</body>
</html>
