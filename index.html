 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Aesthetic Diary ♡</title>

  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #fff7f8;
      color: #6d5058;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 17px;
      margin-bottom: 30px;
    }

    img {
      width: 90%;
      max-width: 600px;
      border-radius: 25px;
      box-shadow: 0 8px 25px rgba(120, 80, 90, 0.18);
    }

    .note {
      background: white;
      margin: 30px auto;
      padding: 25px;
      border-radius: 20px;
      max-width: 600px;
      line-height: 1.7;
    }

    .heart {
      font-size: 25px;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="heart">♡ 🌷 ♡</div>

    <h1>My Aesthetic Diary</h1>

    <p class="subtitle">
      A little hello from me ✨
    </p>

    <img src="diary.jpg" alt="My aesthetic diary">

    <div class="note">
      <h2>Dear Diary ♡</h2>
      <p>
        Little moments, pretty memories and dreams —
        this is my tiny corner of the internet. 🌸
      </p>
    </div>

    <p>Made with love ♡</p>

  </div>
</body>
</html>
